<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hello Brothers Desk</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Hind:wght@400;500;600&display=swap">
<style>
/* Layout: shop counter app. Phone = top bar + cards + bottom tab bar; desktop = black sidebar + content column. Colours from the Hello Brothers logo: yellow + purple/pink. */
:root{
  --bg:#000000; --surface:#111112; --surface-2:#1c1c1e; --line:#2c2c2e;
  --fg:#f5f5f7; --muted:#a1a1a6; --gold:#ffc400; --gold-ink:#000000; --gold-soft:rgba(255,196,0,.14);
  --green:#2f9e7f; --green-soft:rgba(47,158,127,.16); --amber:#e0a63a; --amber-soft:rgba(224,166,58,.15);
  --blue:#7ea6d8; --blue-soft:rgba(126,166,216,.15); --red:#e0675a; --red-soft:rgba(224,103,90,.15);
  --silver:#c9ccd0; --side:#070807; --overlay:rgba(0,0,0,.6);
  --paper:#ffffff; --ink:#1a1a17; --ink-muted:#6b6a63; --paper-line:#e3e3e6;
  --head:"Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --body:"Hind", "Segoe UI", system-ui, sans-serif;
  --r:14px; --nav-h:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f4f5; --surface:#ffffff; --surface-2:#ececee; --line:#e3e3e6;
  --fg:#000000; --muted:#5c5c61; --gold:#5a12e0; --gold-ink:#ffffff; --gold-soft:rgba(90,18,224,.1);
  --green:#0a5a48; --green-soft:rgba(10,90,72,.1); --amber:#9a5f00; --amber-soft:rgba(190,120,0,.12);
  --blue:#2f5f99; --blue-soft:rgba(47,95,153,.1); --red:#b23a2e; --red-soft:rgba(178,58,46,.1);
  --silver:#5d6166; --side:#0c0d0c; --overlay:rgba(20,18,10,.45); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f4f4f5; --surface:#ffffff; --surface-2:#ececee; --line:#e3e3e6;
  --fg:#000000; --muted:#5c5c61; --gold:#5a12e0; --gold-ink:#ffffff; --gold-soft:rgba(90,18,224,.1);
  --green:#0a5a48; --green-soft:rgba(10,90,72,.1); --amber:#9a5f00; --amber-soft:rgba(190,120,0,.12);
  --blue:#2f5f99; --blue-soft:rgba(47,95,153,.1); --red:#b23a2e; --red-soft:rgba(178,58,46,.1);
  --silver:#5d6166; --side:#0c0d0c; --overlay:rgba(20,18,10,.45); color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
h1,h2,h3{font-family:var(--head);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{min-height:100%;display:flex}
.side{display:none}
.main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;margin-inline:-4px;padding-inline:4px;border-bottom:1px solid var(--line)}
.topbar img{width:38px;height:auto}
.topbar .brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--head);font-size:15px;letter-spacing:.06em;color:var(--silver)}
.brand b span{color:var(--gold)}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.topbar .spacer{flex:1}
.wrap{max-width:1040px;margin-inline:auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--side);border-top:1px solid rgba(255,255,255,.25);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav-h);color:#a9aaa2;text-decoration:none;font-size:11.5px;font-weight:500;letter-spacing:.02em}
.nav a svg{width:22px;height:22px}
.nav a.on{color:#ffc400}
.nav a.on svg{filter:drop-shadow(0 0 6px rgba(255,196,0,.45))}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:24px;width:248px;flex:none;position:sticky;top:0;height:100vh;background:var(--side);padding:28px 18px;padding-left:max(18px,env(safe-area-inset-left,0px));border-right:1px solid rgba(255,255,255,.2)}
  .side .logo{width:196px;align-self:center}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#b4b5ad;text-decoration:none;font-weight:500}
  .side nav a svg{width:20px;height:20px}
  .side nav a:hover{background:rgba(255,255,255,.04)}
  .side nav a.on{background:linear-gradient(90deg,rgba(90,18,224,.35),rgba(255,46,160,.18));color:#ffc400}
  .side .foot{margin-top:auto;color:#77786f;font-size:12px}
  .side .foot a{color:#ffc400;text-decoration:none}
  .nav,.topbar .brand,.topbar img{display:none}
  .topbar{border-bottom:0;padding-top:20px}
  .main{padding-bottom:40px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
}

/* common pieces */
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 14px}
.vhead h1{font-size:clamp(24px,5vw,32px)}
.vhead p{margin:2px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.login{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 80% at 20% 0%,#2a0b6b 0%,#000 60%);display:grid;place-items:center;padding:20px;overflow:auto}
.lg-card{width:100%;max-width:380px;background:#0f0f10;border:1px solid #2c2c2e;border-radius:18px;padding:26px 22px;color:#f5f5f7;display:grid;gap:12px}
.lg-card .lg-logo{width:200px;justify-self:center;margin-bottom:4px}
.lg-card h1{font-size:22px;text-align:center}
.lg-card .lg-sub{margin:-6px 0 6px;text-align:center;color:#a1a1a6;font-size:14px}
.lg-card label{color:#a1a1a6}
.lg-card input{background:#1c1c1e;border-color:#2c2c2e;color:#f5f5f7}
.lg-card .btn.gold{background:#ffc400;color:#000}
.lg-err{margin:0;color:#ff7a6b;font-size:14px}
.topbar .acct{margin-left:8px;flex:none}
.icon-btn{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--fg)}
.banner{margin:12px 0 0;padding:10px 14px;border-radius:10px;font-size:14px;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-soft)}
.banner.err{background:var(--red-soft);color:var(--red)}
.section-t{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px}
.section-t h2{font-size:18px}
.section-t a{color:var(--gold);text-decoration:none;font-size:14px;font-weight:500}
.label{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--head);font-size:clamp(20px,4.6vw,26px);font-weight:800;margin-top:2px;overflow-wrap:anywhere}
.kpi .s{color:var(--muted);font-size:13px}
.kpi.hero{background:linear-gradient(140deg,#3a0f8f,#12061f 75%);border-color:rgba(255,196,0,.45);color:#f1eee6}
.kpi.hero .label,.kpi.hero .s{color:#a1a1a6}
.kpi.hero .v{color:#ffc400}

.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--fg)}
.quick button span{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.quick button svg{width:21px;height:21px}
.quick button:hover{border-color:var(--gold)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.search input{border:0;background:transparent;outline:0;padding:9px 0;width:100%;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--fg)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.chip i{font-style:normal;opacity:.7;margin-left:4px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--gold);color:var(--gold-ink)}

.list{display:grid;gap:10px}
@media (min-width:700px){.list.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%;display:block;color:var(--fg);min-width:0}
button.card:hover{border-color:rgba(255,255,255,.55)}
.card .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .t{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.card .sub{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12.5px;margin-top:8px}
.amt{font-family:var(--head);font-weight:800;font-size:17px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-received{background:var(--blue-soft);color:var(--blue)}
.p-repair{background:var(--amber-soft);color:var(--amber)}
.p-waiting{background:var(--gold-soft);color:var(--gold)}
.p-ready{background:var(--green-soft);color:var(--green)}
.p-delivered{background:var(--surface-2);color:var(--muted)}
.p-cancelled,.p-unpaid,.p-left{background:var(--red-soft);color:var(--red)}
.p-paid,.p-active{background:var(--green-soft);color:var(--green)}
.p-leave{background:var(--amber-soft);color:var(--amber)}
.jobno{font-family:var(--head);font-size:12px;color:var(--gold);letter-spacing:.06em}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--head);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:12px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid2{display:grid;gap:10px}
@media (min-width:760px){.grid2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 37px,var(--line) 37px 38px)}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;position:relative}
.bars .b i{display:block;width:70%;max-width:36px;border-radius:6px 6px 2px 2px;background:var(--gold-soft);border:1px solid var(--gold);border-bottom:0;min-height:2px}
.bars .b.today i{background:var(--gold)}
.bars .b em{font-style:normal;font-size:11px;color:var(--muted);position:absolute;transform:translateY(-100%);white-space:nowrap}
.bars-x{display:flex;gap:8px;margin-top:6px}
.bars-x span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;margin-top:10px}
.hbar .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--gold);border-radius:5px}

.avatar{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:800;color:var(--gold);background:var(--gold-soft);border:1.5px solid var(--gold)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--overlay)}
.sheet-panel{position:relative;width:100%;max-width:640px;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;animation:up .22s ease-out}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:20px}
.sheet-body{overflow-y:auto;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{align-items:center;padding:24px}.sheet-panel{border-radius:20px;max-height:88vh}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}}

.form{display:grid;gap:12px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold)}
.f textarea{min-height:70px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:6px}
.actions .grow{margin-right:auto}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--red-soft);color:var(--red);font-weight:500}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 64px 92px 34px;gap:6px;align-items:center}
.line input{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:0}
.line input:focus{border-color:var(--gold)}
.line .x{border:0;background:var(--red-soft);color:var(--red);border-radius:8px;height:36px;font-size:18px}
.line-h{display:grid;grid-template-columns:minmax(0,1fr) 64px 92px 34px;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.totals{display:grid;gap:4px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.totals div{display:flex;justify-content:space-between}
.totals .g{font-family:var(--head);font-weight:800;font-size:19px;color:var(--gold);border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}

.steps{display:flex;gap:4px;margin:6px 0 14px}
.steps div{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.steps div::before{content:"";display:block;height:5px;border-radius:3px;background:var(--surface-2);margin-bottom:5px}
.steps div.done::before{background:var(--gold)}
.steps div.cur{color:var(--gold);font-weight:600}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:12px}
.timeline li{position:relative;font-size:14px}
.timeline li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
.timeline small{color:var(--muted);display:block}
.status-btns{display:flex;flex-wrap:wrap;gap:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast.err{background:var(--red);color:#fff}
@media (min-width:900px){.toast{bottom:28px}}

/* invoice paper: fixed light look in both themes */
.inv-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.inv{background:var(--paper);color:var(--ink);font-family:var(--body);min-width:520px}
.inv .ih{background:#0c0d0c;color:#e8e6df;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 20px}
.inv .ih img{width:150px}
.inv .ih .r{text-align:right;font-size:12px;line-height:1.5}
.inv .ih h3{color:#ffc400;font-size:20px;letter-spacing:.08em}
.inv .ib{padding:18px 20px}
.inv .meta2{display:flex;justify-content:space-between;gap:16px;font-size:13px;margin-bottom:14px}
.inv .meta2 b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.inv table{width:100%;border-collapse:collapse;font-size:13px}
.inv th{background:#5a12e0;color:#fff;text-align:left;padding:7px 8px;font-weight:600}
.inv td{padding:7px 8px;border-bottom:1px solid var(--paper-line);vertical-align:top}
.inv .rt{text-align:right;font-variant-numeric:tabular-nums}
.inv .tot{margin-left:auto;width:260px;margin-top:12px;font-size:13px}
.inv .tot div{display:flex;justify-content:space-between;padding:3px 0}
.inv .tot .g{border-top:2px solid #5a12e0;margin-top:4px;padding-top:6px;font-weight:700;font-size:16px}
.inv .if{display:flex;justify-content:space-between;gap:12px;padding:10px 20px;border-top:1px solid var(--paper-line);font-size:12px;color:var(--ink-muted)}
.inv .stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;padding:1px 8px;font-weight:700;letter-spacing:.08em;font-size:12px}
.inv .stamp.paid{color:#0a5a48}.inv .stamp.unpaid{color:#b23a2e}
</style>

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const inr = n => "₹" + Math.round(num(n)).toLocaleString("en-IN");
const inr2 = n => "₹" + num(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});

const pad = n => String(n).padStart(2,"0");
const dstr = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => dstr(new Date());
const fmtDate = s => s ? new Date(s+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}) : "";
const fmtTime = ms => ms ? new Date(ms).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}) : "";
const sum = (arr,f) => arr.reduce((a,x)=>a+num(typeof f==="function"?f(x):x[f]),0);

const nextNo = (arr, field, prefix, start) => {
  const max = arr.reduce((m,x)=>{ const n = parseInt(String(x[field]||"").replace(/\D/g,""),10); return isFinite(n)&&n>m?n:m; }, start);
  return prefix + String(max+1).padStart(prefix==="HB-"?4:3,"0");
};
function billTotals(items, gst, discount){
  const sub = sum(items, i=>num(i.qty)*num(i.rate));
  const disc = Math.min(num(discount), sub);
  const taxable = sub - disc;
  const tax = Math.round(taxable*num(gst))/100;
  const total = Math.round(taxable + tax);
  return { sub, disc, taxable, tax, total, round: +(total-(taxable+tax)).toFixed(2) };
}
function toast(msg, kind){
  const t=$("#toast"); t.textContent=msg; t.className="toast"+(kind==="err"?" err":""); t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 2600);
}
function errMsg(e){
  const c = e && e.code;
  if(c==="no_delete") return "Delete sirf admin kar sakta hai.";
  if(c==="42501") return "Aapko ye karne ki permission nahi hai.";
  if(e && e.message && /fetch|network/i.test(e.message)) return "Internet nahi hai. Connection check karke dobara try karein.";
  if(c==="quota_exceeded") return "Storage full ho gaya. Purane records delete karke dobara try karein.";
  if(c==="invalid_argument") return "Save nahi hua: aapko is page par likhne ki permission nahi hai.";
  if(c==="resource_exhausted") return "Bahut tez requests. Thoda ruk kar dobara try karein.";
  return "Save nahi hua. Internet check karke dobara try karein.";
}

/* ---------- store ---------- */
const TBL = col => "desk_"+col;
const rowToDoc = r => ({...(r.data||{}), id:r.id});
async function addDoc(col,obj){
  const now=Date.now(); obj.createdAt=now; obj.updatedAt=now;
  const body={...obj}; delete body.id;
  const { data, error } = await S.db.from(TBL(col)).insert({ data:body }).select("id").single();
  if(error) throw error;
  S.data[col]=[{...body,id:data.id},...S.data[col].filter(x=>x.id!==data.id)]; render();
  return data.id;
}
async function saveDoc(col,id,obj){
  const body={...obj}; delete body.id; body.updatedAt=Date.now();
  const { error } = await S.db.from(TBL(col)).update({ data:body, updated_at:new Date().toISOString() }).eq("id",id);
  if(error) throw error;
  S.data[col]=S.data[col].map(x=>x.id===id?{...body,id}:x); render();
}
async function delDoc(col,id){
  const { data, error } = await S.db.from(TBL(col)).delete().eq("id",id).select("id");
  if(error) throw error;
  if(!data || !data.length) throw { code:"no_delete" };
  S.data[col]=S.data[col].filter(x=>x.id!==id); render();
}
async function run(fn, ok){
  try{ const r = await fn(); if(ok) toast(ok); return r===undefined?true:r; }
  catch(e){ console.error(e); toast(errMsg(e),"err"); return false; }
}
const get = (col,id) => S.data[col].find(x=>x.id===id);

async function loadCol(col){
  const { data, error } = await S.db.from(TBL(col)).select("id,data,created_at").order("created_at",{ascending:false}).limit(5000);
  if(error) throw error;
  S.data[col]=data.map(rowToDoc); S.loaded[col]=true;
}
async function loadAll(){
  const timer=setTimeout(()=>{ if(S.mode==="loading"){ S.mode="slow"; render(); } },10000);
  try{
    await Promise.all(COLS.map(loadCol));
    S.mode="live";
  }catch(e){ console.error(e); S.mode="error"; S.err=e&&(e.message||e.code)||""; }
  clearTimeout(timer); render();
}
function subscribe(){
  if(S.chan) S.db.removeChannel(S.chan);
  const t={};
  S.chan=S.db.channel("hb-desk");
  COLS.forEach(col=>S.chan.on("postgres_changes",{event:"*",schema:"public",table:TBL(col)},()=>{
    clearTimeout(t[col]); t[col]=setTimeout(()=>loadCol(col).then(render).catch(()=>{}),400);
  }));
  S.chan.subscribe();
}
async function startSession(session){
  S.user=session.user; S.mode="loading"; hideLogin(); render();
  const { data:me } = await S.db.from("desk_members").select("role").eq("email",(S.user.email||"").toLowerCase()).maybeSingle();
  if(!me){ S.mode="error"; S.err="ye email app ka member nahi hai"; S.canWrite=false; render(); return; }
  S.role=me.role; S.canWrite=true;
  await loadAll(); subscribe();
}
function showLogin(msg){
  $("#login").hidden=false; $(".app").setAttribute("aria-hidden","true");
  $("#lgErr").textContent=msg||""; $("#lgErr").hidden=!msg;
}
function hideLogin(){ $("#login").hidden=true; $(".app").removeAttribute("aria-hidden"); }
async function init(){
  const cfg=window.HB_SUPABASE||{};
  if(!window.supabase || !cfg.url || cfg.url.startsWith("__")){ S.mode="error"; S.err="Supabase load nahi hua, internet check kariye"; render(); showLogin("Server se connect nahi ho paaya. Internet check karke page dobara kholiye."); return; }
  S.db=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});
  render();
  S.db.auth.onAuthStateChange((ev,session)=>{
    if(ev==="SIGNED_OUT"){ S.user=null; S.role=""; COLS.forEach(c=>{S.data[c]=[];S.loaded[c]=false;}); if(S.chan){S.db.removeChannel(S.chan);S.chan=null;} render(); showLogin(); }
  });
  const { data:{ session } } = await S.db.auth.getSession();
  if(session) startSession(session); else showLogin();
}
async function doLogin(ev){
  ev.preventDefault();
  const email=$("#lgEmail").value.trim(), password=$("#lgPass").value;
  const btn=$("#lgBtn"); btn.disabled=true; btn.textContent="Login ho raha hai…"; $("#lgErr").hidden=true;
  const { data, error } = await S.db.auth.signInWithPassword({ email, password });
  btn.disabled=false; btn.textContent="Login";
  if(error){ showLogin(/invalid/i.test(error.message)?"Email ya password galat hai.":"Login nahi hua: "+error.message); return; }
  $("#lgPass").value=""; startSession(data.session);
}

function navHtml(){ return VIEWS.map(v=>`<a href="#${v.k}" class="${S.view===v.k?"on":""}" ${S.view===v.k?'aria-current="page"':""}>${ICON[v.k]}<span>${v.l}</span></a>`).join(""); }
function bannerHtml(){
  const b=[];
  
  if(S.mode==="slow") b.push(`<div class="banner">Data abhi load nahi ho paaya. Internet check kariye, page khud update ho jayega.</div>`);
  if(S.mode==="error") b.push(`<div class="banner err">Data load nahi hua${S.err?" ("+esc(S.err)+")":""}. Page dobara kholiye.</div>`);
  if(!S.canWrite) b.push(`<div class="banner">Aapke paas sirf dekhne ki permission hai. Admin se access maangiye.</div>`);
  return b.join("");
}
function render(){
  $("#sideNav").innerHTML = navHtml();
  $("#bottomNav").innerHTML = navHtml();
  $("#banner").innerHTML = bannerHtml();
  $("#quickAddBtn").hidden = !S.canWrite;
  const scrollY = window.scrollY;

  $("#view").innerHTML = ({home:vHome,status:vStatus,sales:vSales,bills:vBills,staff:vStaff}[S.view])();

}
const loadingOr = (html) => (S.mode==="loading" ? `<div class="empty"><b>Records load ho rahe hain…</b>Jobs, sales, bills aur staff ki list abhi dikhegi.</div>` : html);

  </button>`;
}
function vStatus(){
  const jobs=S.data.jobs;
  const q=S.jobQ.trim().toLowerCase();
  const isActive = j=>!["delivered","cancelled"].includes(j.status);
  let list = jobs.filter(j=> S.jobFilter==="all" ? true : S.jobFilter==="active" ? isActive(j) : j.status===S.jobFilter);
  if(q) list=list.filter(j=>[j.customer,j.phone,j.device,j.problem,j.no].join(" ").toLowerCase().includes(q));
  list.sort(byNew);
  const cnt = k => k==="all"?jobs.length : k==="active"?jobs.filter(isActive).length : jobs.filter(j=>j.status===k).length;
  const chips=[{k:"active",l:"Chalu"},{k:"all",l:"Sab"},...STATUSES];
  return `
  <div class="vhead"><div><h1>Status updates</h1><p>Har phone ka repair status, customer ke saath</p></div>${S.canWrite?`<button class="btn gold" data-act="newJob">+ Naya job</button>`:""}</div>
  <div class="toolbar"><label class="search">${ICON.search}<input id="jobQ" type="search" placeholder="Naam, phone, model ya job no. se dhoondo" value="${esc(S.jobQ)}" data-in="jobQ"></label></div>
  <div class="chips">${chips.map(c=>`<button class="chip ${S.jobFilter===c.k?"on":""}" data-act="jobFilter" data-f="${c.k}">${c.l}<i>${cnt(c.k)}</i></button>`).join("")}</div>
  ${loadingOr(list.length?`<div class="list two">${list.map(jobCard).join("")}</div>` : jobs.length?`<div class="empty">Is filter me koi job nahi mila.</div>`:emptyJobs())}`;
}

function openJob(id){
  const j=get("jobs",id); if(!j){ closeSheet(); return; }

    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">${pill(j.status,stLabel(j.status))}<span class="sub" style="color:var(--muted);font-size:13px">Update: ${esc(fmtTime(j.updatedAt))}</span></div>
    ${j.status==="cancelled"?"":`<div class="steps">${FLOW.map((k,i)=>`<div class="${fi>=i?"done":""} ${fi===i?"cur":""}">${stLabel(k)}</div>`).join("")}</div>`}
    <dl class="kv">
      <dt>Phone</dt><dd>${esc(j.device)}</dd><dt>Problem</dt><dd>${esc(j.problem)}</dd>
      <dt>Mobile</dt><dd>${esc(j.phone||"—")}</dd><dt>Jama date</dt><dd>${esc(fmtDate(j.date))}</dd>

      <dt>Estimate</dt><dd class="num">${inr(j.estimate)}${num(j.advance)?` · Advance ${inr(j.advance)} · Baaki <b>${inr(balance)}</b>`:""}</dd>
      <dt>Technician</dt><dd>${esc(staffName(j.assignedTo)||"—")}</dd>
      ${j.notes?`<dt>Notes</dt><dd>${esc(j.notes)}</dd>`:""}
    </dl>
    ${S.canWrite?`<div class="section-t" style="margin-top:20px"><h2>Status badlo</h2></div>
    <div class="f" style="margin-bottom:8px"><label for="stNote">Note (optional)</label><input id="stNote" placeholder="Jaise: Display order kiya, kal aayega"></div>

    <ul class="timeline">${hist.map(h=>`<li><b>${esc(stLabel(h.status))}</b>${h.note?` — ${esc(h.note)}`:""}<small>${esc(fmtTime(h.at))}</small></li>`).join("")||"<li>Koi history nahi</li>"}</ul>

      <button class="btn danger grow" data-act="askDel" data-col="jobs" data-id="${esc(j.id)}">Delete</button>

      <button class="btn gold" data-act="editJob" data-id="${esc(j.id)}">Edit</button>
    </div>`:""}`);
}
async function setStatus(id,st){
  const j=get("jobs",id); if(!j) return;
  const note=($("#stNote")||{}).value||"";
  const history=[...(j.history||[]),{status:st,note:note.trim(),at:Date.now()}];
  const ok = await run(()=>saveDoc("jobs",id,{...j,status:st,history}),"Status: "+stLabel(st));
  if(ok) openJob(id);
}

/* ---------- SALES ---------- */
function periodRange(p){
  const d=new Date(), t=today();
  if(p==="today") return [t,t];
  if(p==="week"){ const s=new Date(d); s.setDate(d.getDate()-6); return [dstr(s),t]; }
  if(p==="month") return [t.slice(0,7)+"-01",t];
  return ["0000-00-00","9999-12-31"];
}
function vSales(){
  const [a,b]=periodRange(S.period);
  const list=S.data.sales.filter(s=>s.date>=a&&s.date<=b).sort((x,y)=>(y.date||"").localeCompare(x.date||"")||byNew(x,y));
  const total=sum(list,"amount");
  const byCat={}, byPay={};
  list.forEach(s=>{ byCat[s.category||"Other"]=(byCat[s.category||"Other"]||0)+num(s.amount); byPay[s.payment||"Cash"]=(byPay[s.payment||"Cash"]||0)+num(s.amount); });
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=dstr(d); days.push({k,l:i===0?"Aaj":d.toLocaleDateString("en-IN",{weekday:"short"}),v:sum(S.data.sales.filter(s=>s.date===k),"amount")}); }
  const max=Math.max(1,...days.map(d=>d.v));
  const hb = (obj)=>{ const e=Object.entries(obj).sort((x,y)=>y[1]-x[1]); const m=Math.max(1,...e.map(x=>x[1])); return e.length? e.map(([k,v])=>`<div class="hbar"><span>${esc(k)}</span><div class="track"><i style="width:${(v/m*100).toFixed(1)}%"></i></div><b class="num">${inr(v)}</b></div>`).join("") : `<p class="sub" style="color:var(--muted)">Is period me koi sale nahi.</p>`; };
  const P=[{k:"today",l:"Aaj"},{k:"week",l:"7 din"},{k:"month",l:"Is mahine"},{k:"all",l:"Sab"}];
  return `
  <div class="vhead"><div><h1>Sales</h1><p>Har sale record karein, total aur summary yahin</p></div>${S.canWrite?`<button class="btn gold" data-act="newSale">+ Sale add</button>`:""}</div>
  <div class="toolbar"><div class="seg" role="tablist">${P.map(p=>`<button class="${S.period===p.k?"on":""}" data-act="period" data-p="${p.k}">${p.l}</button>`).join("")}</div></div>
  <div class="kpis">
    <div class="kpi hero"><div class="label">Total sale</div><div class="v num">${inr(total)}</div><div class="s">${P.find(p=>p.k===S.period).l}</div></div>
    <div class="kpi"><div class="label">Entries</div><div class="v num">${list.length}</div><div class="s">Qty ${sum(list,s=>s.qty||1)}</div></div>
    <div class="kpi"><div class="label">Average</div><div class="v num">${inr(list.length?total/list.length:0)}</div><div class="s">per entry</div></div>
    <div class="kpi"><div class="label">Cash / UPI</div><div class="v num" style="font-size:18px">${inr(byPay.Cash||0)} / ${inr(byPay.UPI||0)}</div><div class="s">Udhaar ${inr(byPay.Udhaar||0)}</div></div>
  </div>
  <div class="grid2" style="margin-top:10px">
    <div class="panel"><div class="label">Pichhle 7 din</div>
      <div class="bars">${days.map(d=>`<div class="b ${d.k===today()?"today":""}"><i style="height:${(d.v/max*100).toFixed(1)}%"></i>${d.v?`<em style="bottom:${(d.v/max*100).toFixed(1)}%">${inr(d.v)}</em>`:""}</div>`).join("")}</div>
      <div class="bars-x">${days.map(d=>`<span>${d.l}</span>`).join("")}</div></div>
    <div class="panel"><div class="label">Category ke hisaab se</div>${hb(byCat)}</div>
  </div>
  <div class="section-t"><h2>Sale entries</h2></div>
  ${loadingOr(list.length?`<div class="list">${list.map(s=>`<button class="card" data-act="editSale" data-id="${esc(s.id)}"><div class="row"><div style="min-width:0"><div class="t">${esc(s.item)}</div><div class="sub">${esc(s.category||"Other")} · ${esc(s.payment||"Cash")}${s.customer?" · "+esc(s.customer):""}${num(s.qty)>1?" · Qty "+esc(s.qty):""}</div></div><div style="text-align:right"><div class="amt num">${inr(s.amount)}</div><div class="sub" style="color:var(--muted);font-size:12.5px">${esc(fmtDate(s.date))}</div></div></div></button>`).join("")}</div>`
    : `<div class="empty"><b>Is period me koi sale nahi</b>Repair, accessory ya training ki har payment yahan add kariye.${S.canWrite?`<br><button class="btn gold" data-act="newSale">+ Sale add karo</button>`:""}</div>`)}`;
}

async function saveFile(filename,data){

    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();

  }catch(e){ toast("Download nahi hua","err"); }
}

    const ok=await run(()=>saveDoc("bills",b.id,{...b,status:st}),st==="paid"?"Paid mark ho gaya":"Unpaid mark ho gaya");
    if(ok && st==="paid") await linkSale(b.id); openBill(b.id); },
  pdf: el=>{ const b=get("bills",el.dataset.id); let buf; try{ buf=billPdf(b); }catch(e){ console.error(e); toast("PDF nahi bana","err"); return; } saveFile(`Bill-${b.number}.pdf`, new Blob([buf],{type:"application/pdf"})); },
  htmlDl: el=>{ const b=get("bills",el.dataset.id); saveFile(`Bill-${b.number}.html`, billHtmlDoc(b)); },
  copyBill: el=>{ const txt=billText(get("bills",el.dataset.id));
    const fallback=()=>{ $("#copyZone").innerHTML=`<div class="f" style="margin-top:10px"><label for="copyTxt">Yeh text select karke copy karein</label><textarea id="copyTxt" rows="8">${esc(txt)}</textarea></div>`; $("#copyTxt").select(); };
    try{ navigator.clipboard.writeText(txt).then(()=>toast("Bill text copy ho gaya"),fallback); }catch(e){ fallback(); } },
  askDel: el=>{
    const zone = el.closest(".actions");
    const {col,id}=el.dataset;
    zone.innerHTML=`<div class="confirm" style="width:100%">${DEL_TEXT[col]} pakka delete karein? Wapas nahi aayega.<span style="flex:1"></span><button type="button" class="btn sm ghost" data-act="cancelDel" data-col="${col}" data-id="${esc(id)}">Nahi</button><button type="button" class="btn sm danger" data-act="doDel" data-col="${col}" data-id="${esc(id)}">Haan, delete</button></div>`;
  },
  cancelDel: el=>{ const {col,id}=el.dataset; ({jobs:()=>openJob(id),bills:()=>openBill(id),sales:()=>saleForm(get("sales",id)),staff:()=>staffForm(get("staff",id))})[col](); },
  doDel: async el=>{ const {col,id}=el.dataset; const ok=await run(()=>delDoc(col,id),"Delete ho gaya"); if(ok) closeSheet(); }
};
document.addEventListener("click", ev=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const fn=ACT[el.dataset.act]; if(!fn) return;
  if(el.tagName!=="A"||el.dataset.act==="filterJobs"){ if(el.tagName!=="A") ev.preventDefault(); }
  fn(el);
});
document.addEventListener("input", ev=>{
  const k=ev.target.dataset && ev.target.dataset.in; if(!k) return;
  S[k]=ev.target.value; render();
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && !$("#sheet").hidden) closeSheet(); });
function route(){ const h=location.hash.replace("#",""); S.view=VIEWS.some(v=>v.k===h)?h:"home"; closeSheet(); render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", route);
S.view = VIEWS.some(v=>v.k===location.hash.slice(1)) ? location.hash.slice(1) : "home";
$("#lgForm").addEventListener("submit",doLogin);
init();
</script>
